# CI — runs at release time only (family rule, Richard 2026-07-12: no CI on
# every commit; the local gates cover development).  One job so far: build
# libftx, the CLI tools and the GTK4/libadwaita app on ubuntu-26.04.
# Packaging jobs (AppImage/.deb/.rpm) arrive with the first installable app.
name: build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive
  # libftx: fftw3; app layer: glib, libwebsockets; GUI: gtk4 >= 4.12,
  # libadwaita >= 1.5 (glib-compile-resources comes with libglib2.0-dev)
  APT_DEPS: meson ninja-build libfftw3-dev libglib2.0-dev libwebsockets-dev libgtk-4-dev libadwaita-1-dev

jobs:
  gates:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $APT_DEPS
      - name: Build
        run: |
          meson setup build
          meson compile -C build
